name: Streamlit Keep-Alive (Playwright)

on:
  schedule:
    # Run every 8 hours to keep the Streamlit WebSocket session active
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Streamlit App URL to wake/ping'
        required: false
        default: 'https://map-intelligence.streamlit.app'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit App via Headless Browser
        env:
          APP_URL: ${{ github.event.inputs.app_url || vars.STREAMLIT_APP_URL || 'https://map-intelligence.streamlit.app' }}
        run: |
          python - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          print(f"Visiting {url} ...")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(15000)

              # Click Streamlit Cloud wake-up button if app was hibernating
              wake_btn = page.get_by_role("button", name="Yes, get this app back up!")
              if wake_btn.count() > 0:
                  print("App was sleeping — clicking wake-up button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(20000)

              print("Page title:", page.title())
              browser.close()
          print("Keep-alive visit completed.")
          EOF
