name: Streamlit Keep-Alive

on:
  schedule:
    # Run daily at 06:00 UTC to keep the Streamlit app active and responsive
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Streamlit App URL to ping'
        required: false
        default: 'https://map-data-analysis-project.streamlit.app'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        env:
          APP_URL: ${{ github.event.inputs.app_url || vars.STREAMLIT_APP_URL || 'https://map-data-analysis-project.streamlit.app' }}
        run: |
          echo "Pinging Streamlit app at: $APP_URL"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL" || echo "failed")
          echo "Received HTTP response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "Streamlit app is active and responsive. Sleep timer successfully reset."
          else
            echo "Warning: Response code was $HTTP_STATUS (App might be booting up or URL needs configuration in repo variables)."
          fi
